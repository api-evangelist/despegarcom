aid: despegarcom
name: Despegar.com
description: >-
  Despegar.com (NYSE: DESP) is the leading online travel company in Latin
  America, operating the consumer brands Despegar and Decolar alongside the B2B
  HotelDo / BestDay distribution network. Its B2B travel API lets partners
  integrate hotels, flights and activities into their own systems, covering the
  full search, prebook, payment, booking and after-sales (cancellation,
  rescheduling, special requests) flows, plus geographic and static-content
  services, push-based event webhooks, a Rewards loyalty API, and an mTLS
  Security API for B2B transactions. Despegar also publishes official hosted MCP
  servers for agent-based flight and hotel search, and an llms.txt index of its
  developer documentation.
